{% extends 'console_base.html' %}{% set app_name = 'Story Starter' %}{% block game_class %}story-console{% endblock %}
{% block game %}
<section id="worldMap" class="world-map" aria-labelledby="gameTitle"><div class="map-title"><p class="title-overline">STORY STARTER</p><h1 id="gameTitle" class="map-logo">The Story Atlas</h1><p>Choose a world. Step into its story.</p></div><button class="world-node cloud-node" type="button" data-world="cloud"><span class="world-orb">✦</span><strong>Cloud Harbour</strong><small>A compass has gone missing</small></button><button class="world-node wood-node" type="button" data-world="wood"><span class="world-orb">✧</span><strong>Moonwood</strong><small>A forest has lost its voice</small></button><button class="world-node tide-node" type="button" data-world="tide"><span class="world-orb">◇</span><strong>Tideglass Cove</strong><small>A secret beneath the sea</small></button><div class="map-menu"><button id="resumeStory" class="title-command" type="button" hidden>Continue your journey</button><button id="storyJournal" class="title-command" type="button">Open story journal</button></div></section>
<div id="storyPlay" class="play-ui" hidden><div class="location-plate"><span id="storyLocation"></span><strong id="storyChapter">Arrival</strong></div><div class="story-party"><span>MOTE</span><span id="storyHeroName">Your companion</span><button id="returnMap" class="system-button" type="button">World map</button></div><section id="storyDialogue" class="dialogue-box" aria-labelledby="speaker"><div class="speaker-name" id="speaker">MOTE</div><p id="storyCue"></p><div id="storyHeroChoices" class="dialogue-choices"></div><label class="sr-only" for="chapterText">Your chapter</label><textarea id="chapterText" rows="2" maxlength="1200" placeholder="What happens next?" hidden></textarea><div class="dialogue-footer"><span id="chapterHint"></span><button id="storyAdvance" class="next-command" type="button" hidden>Continue →</button></div></section></div>
{% endblock %}{% block scripts %}<script src="{{ url_for('static', filename='console/story.js') }}"></script>{% endblock %}
