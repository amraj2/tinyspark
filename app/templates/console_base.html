<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111322"><title>{{ app_name or 'TinySpark' }} · TinySpark</title><link rel="stylesheet" href="{{ url_for('static', filename='console/console.css') }}">{% block head %}{% endblock %}</head>
<body class="console-body {% block game_class %}{% endblock %}">
<main id="console" class="console" aria-label="{{ app_name or 'TinySpark' }} game">
<canvas id="worldCanvas" class="world-canvas" width="1280" height="720" aria-label="Animated game world"></canvas>
<div class="film-grain" aria-hidden="true"></div>
<nav class="system-bar" aria-label="Game controls"><a href="{{ url_for('main.index') }}" class="system-button" aria-label="Back to Adventure HQ">⌂ <span>HQ</span></a><button id="pauseButton" class="system-button" type="button">Ⅱ <span>Menu</span></button><span id="sessionStatus" class="session-status"></span></nav>
{% block game %}{% endblock %}
<div id="announcer" class="sr-only" role="status" aria-live="polite"></div><div id="toast" class="game-toast" role="status" hidden></div>
</main>
<dialog id="pauseDialog" class="game-dialog"><p class="eyebrow">GAME PAUSED</p><h2>Take your time.</h2><button id="resumeButton" class="command primary" type="button">▶ Resume game</button><button id="soundButton" class="command" type="button" aria-pressed="false">Sound: off</button><button id="motionButton" class="command" type="button" aria-pressed="false">Reduced motion: off</button><a href="{{ url_for('main.index') }}" class="command">Return to Adventure HQ</a><p class="small-copy">Progress and creations stay on this device.</p></dialog>
{% if request.blueprint != 'elevenplus' %}{% include '_analytics.html' %}{% endif %}
<script id="app-config" type="application/json">{{ (config_json or {})|tojson }}</script><script src="{{ url_for('static', filename='shared.js') }}"></script><script src="{{ url_for('static', filename='console/core.js') }}"></script>{% block scripts %}{% endblock %}
</body></html>
